<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="HyPurShot">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<title>HyPurShot — Projects</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="logo-nav.webp">
<link rel="preload" href="/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="projects.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="onboarding.js"></script>
</head>
<body class="jobs">

<header class="navbar">
  <a href="projects.html" class="nav-logo">
    <img src="logo-nav.webp" alt="HyPurShot">
  </a>
  <div class="nav-title">Projects</div>
  <a href="team.html" class="nav-avatar" id="nav-avatar">··</a>
</header>

<main class="page">

  <div id="gbp-nudge" class="board-note note-review">
    <p>You can shoot jobs without a Google review link. Add one when you want to text customers for a review.</p>
    <a href="team.html#gbp">Add review link</a>
  </div>

  <div id="usage-badge" class="board-note">
    <p id="usage-text">Free plan.</p>
    <a href="index.html#pricing">Upgrade</a>
  </div>

  <div class="filter-row" id="filter-row">
    <button type="button" class="chip active" data-filter="active">Active<span class="n" data-count="active"></span></button>
    <button type="button" class="chip" data-filter="completed">Completed<span class="n" data-count="completed"></span></button>
    <button type="button" class="chip" data-filter="all">All<span class="n" data-count="all"></span></button>
  </div>

  <div id="list-container" aria-busy="true" aria-live="polite">
    <div class="job-sheet" aria-hidden="true">
      <div class="job-skel"><div class="skel-photo"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line mid"></div><div class="skel-line short"></div></div></div>
      <div class="job-skel"><div class="skel-photo"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line mid"></div><div class="skel-line short"></div></div></div>
      <div class="job-skel"><div class="skel-photo"></div><div class="skel-lines"><div class="skel-line"></div><div class="skel-line mid"></div><div class="skel-line short"></div></div></div>
    </div>
  </div>

</main>

<a class="new-job" href="project-new.html">New job</a>

<script src="app.js"></script>
<script>
let currentFilter = 'active';
let allProjects = [];
let thumbsByJob = {};
let loaded = false;

async function loadProjects() {
  const container = document.getElementById('list-container');
  const { data, error } = await HPS.sb
    .from('jobs')
    .select('id, customer_name, vehicle_info, service_type, description, status, started_at, completed_at, created_at')
    .eq('business_id', HPS.businessId)
    .order('started_at', { ascending: false, nullsFirst: false })
    .limit(200);

  if (error) {
    container.innerHTML = emptyBlock('We could not load your jobs', error.message || 'Please try again.');
    container.setAttribute('aria-busy', 'false');
    return;
  }
  allProjects = data || [];

  // Pull a representative thumbnail per job (latest media)
  const jobIds = allProjects.map(p => p.id);
  thumbsByJob = {};
  if (jobIds.length) {
    const { data: media } = await HPS.sb
      .from('media')
      .select('job_id, original_url, watermarked_url, media_type, created_at')
      .in('job_id', jobIds)
      .order('created_at', { ascending: false });
    if (media) {
      for (const m of media) {
        if (!thumbsByJob[m.job_id]) {
          thumbsByJob[m.job_id] = m.watermarked_url || m.original_url || null;
        }
      }
    }
  }
  loaded = true;
  renderList();
}

function jobsFor(filter) {
  if (filter === 'active') return allProjects.filter(p => p.status === 'in_progress');
  if (filter === 'completed') return allProjects.filter(p => p.status === 'completed');
  return allProjects.filter(p => p.status !== 'archived');
}

function renderList() {
  const container = document.getElementById('list-container');
  setCounts();
  const list = jobsFor(currentFilter);

  if (!list.length) {
    container.innerHTML = renderEmpty();
    container.setAttribute('aria-busy', 'false');
    return;
  }

  container.innerHTML = '<div class="job-sheet">' + list.map(renderJob).join('') + '</div>';
  container.setAttribute('aria-busy', 'false');
}

function renderJob(p) {
  const lines = jobLines(p);
  const who = String(p.customer_name || '').trim();
  const when = HPS.fmtDate(p.started_at || p.created_at);
  const done = p.status === 'completed';
  const status = currentFilter === 'all'
    ? '<span class="job-status">' + (done ? 'Completed' : 'Active') + '</span>'
    : '';
  const thumb = thumbsByJob[p.id];
  const photo = thumb
    ? '<img src="' + escapeAttr(thumb) + '" alt="" onerror="this.remove()">'
    : '';
  const sub = lines.sub
    ? '<p class="job-service">' + escapeHtml(lines.sub) + '</p>'
    : '';
  const bits = [];
  if (who) bits.push('<span class="job-who">' + escapeHtml(who) + '</span>');
  if (when) bits.push('<span class="job-when">' + escapeHtml(when) + '</span>');
  const meta = bits.length ? '<p class="job-meta">' + bits.join(' · ') + '</p>' : '';
  return '<a class="job ' + (done ? 'is-done' : 'is-active') + '" href="project.html?id=' + escapeAttr(p.id) + '">' +
    '<div class="job-photo">' + photo + '</div>' +
    '<div class="job-main">' +
      '<div class="job-head"><h3>' + escapeHtml(lines.headline) + '</h3>' + status + '</div>' +
      sub + meta +
    '</div></a>';
}

function jobLines(p) {
  const vehicle = clean(p.vehicle_info);
  const service = clean(p.service_type);
  const desc = clean(p.description);
  const headline = vehicle || desc || service || 'Untitled job';
  let sub = '';
  if (vehicle) {
    if (desc && !sameText(desc, vehicle)) sub = desc;
    else if (service && !sameText(service, vehicle)) sub = service;
  } else if (desc && service && !sameText(service, desc)) {
    sub = service;
  }
  return { headline: headline, sub: sub };
}

function clean(s) { return String(s == null ? '' : s).trim(); }
function sameText(a, b) { return a.toLowerCase() === b.toLowerCase(); }

function setCounts() {
  const counts = {
    active: jobsFor('active').length,
    completed: jobsFor('completed').length,
    all: jobsFor('all').length
  };
  document.querySelectorAll('[data-count]').forEach(el => {
    el.textContent = String(counts[el.getAttribute('data-count')] || 0);
  });
}

function renderEmpty() {
  if (currentFilter === 'completed') {
    return emptyBlock('No finished jobs yet', 'They show up here after you mark a job done.');
  }
  if (currentFilter === 'active' && jobsFor('all').length) {
    return emptyBlock('No open jobs', 'Finished ones are under Completed.');
  }
  return emptyBlock('No jobs yet', 'Tap New job when the next car is ready.');
}

function emptyBlock(title, body) {
  return '<div class="jobs-empty"><h3>' + escapeHtml(title) + '</h3><p>' + escapeHtml(body) + '</p></div>';
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

document.getElementById('filter-row').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('#filter-row .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  if (loaded) renderList();
});

async function renderUsageBadge() {
  try {
    const usage = await HPS.getUsage();
    if (!usage || usage.plan !== 'free') return;
    const mediaCap = usage.limits.media;
    const reviewCap = usage.limits.reviews_month;
    document.getElementById('usage-text').textContent =
      'Free plan. ' + usage.media_count + ' of ' + mediaCap + ' photos and videos. ' +
      usage.reviews_this_month + ' of ' + reviewCap + ' review requests this month.';
    document.getElementById('usage-badge').classList.add('is-shown');
  } catch (e) { /* silent */ }
}

(async () => {
  const ok = await HPS.init();
  if (!ok) return;
  // Set avatar initials
  const nm = (HPS.business && HPS.business.name) ? HPS.business.name : '';
  const initials = nm.split(/\s+/).map(w => w[0]).filter(Boolean).slice(0,2).join('').toUpperCase() || 'HS';
  document.getElementById('nav-avatar').textContent = initials;
  HPS.renderBottomNav('projects');
  await loadProjects();
  renderUsageBadge();
  // Nudge if no Google review link is set yet
  const link = HPS.business && HPS.business.gbp_review_link;
  if (!link || !String(link).trim()) {
    document.getElementById('gbp-nudge').classList.add('is-shown');
  }
})();
</script>
</body>
</html>
