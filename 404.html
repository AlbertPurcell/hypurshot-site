<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // FAST-PATH redirects. Runs before any CSS/fonts load, so the customer's
  // browser hits the destination in one round trip. Keep this block tiny —
  // no external deps, no DOM lookups.
  (function(){
    var p = location.pathname || '';
    // /review/{token} → hit the review-redirect edge fn which server-side 302s to Google.
    var rm = p.match(/^\/review\/([A-Za-z0-9_-]{8,64})\/?$/);
    if (rm && rm[1]) {
      location.replace('https://xjsicupdpzawxlwcvxzv.supabase.co/functions/v1/review-redirect?token=' + encodeURIComponent(rm[1]));
      return;
    }
    // /p/{token} → shared-link viewer
    var pm = p.match(/^\/p\/([A-Za-z0-9_-]{4,64})\/?$/);
    if (pm && pm[1]) { location.replace('/p.html?t=' + encodeURIComponent(pm[1])); return; }
    // /card/{slug} → digital card
    var cm = p.match(/^\/card\/([A-Za-z0-9_-]{2,120})\/?$/);
    if (cm && cm[1]) { location.replace('/card.html?slug=' + encodeURIComponent(cm[1])); return; }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-title" content="HyPurShot">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0D0D0D">
<title>HyPurShot</title>
<link rel="icon" type="image/png" href="/logo-nav.webp">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .nf {
    max-width: 460px; text-align: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 36px 28px;
  }
  .nf h1 {
    font-family: var(--font-heading); font-weight: 800;
    font-size: 1.6rem; letter-spacing: -0.01em; margin-bottom: 10px;
  }
  .nf p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.55; margin-bottom: 22px; }
  .nf a {
    display: inline-flex; align-items: center; gap: 6px;
    height: 42px; padding: 0 20px;
    background: var(--gold); color: var(--bg);
    border-radius: 8px; font-weight: 700; font-size: 0.88rem;
  }
  .nf a:hover { background: var(--gold-hover); }
  .nf .loading { color: var(--text-muted); font-size: 0.86rem; }
</style>
</head>
<body>

<div class="nf" id="card">
  <h1 id="title">Page not found</h1>
  <p id="body">The page you're looking for doesn't exist or has moved.</p>
  <a href="/" id="cta">Back to home</a>
</div>

</body>
</html>
