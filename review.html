<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0D0D0D">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://xjsicupdpzawxlwcvxzv.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://search.google.com">
<link rel="icon" type="image/webp" href="/logo-nav.webp">
<title>Leave a review | HyPurShot</title>
<meta name="description" content="Redirecting you to Google Reviews.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:none}
body{
  min-height:100dvh;background:#0D0D0D;color:#F0EDE8;
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:0 24px
}
.page{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column}
header{padding:24px 0 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.08)}
header img{display:block;height:40px;width:auto;margin:0 auto;object-fit:contain}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 0}
h1{font-weight:700;font-size:clamp(1.5rem,1.2rem + 1.25vw,2rem);color:#A8D4E6;margin-bottom:8px;line-height:1.2}
p{color:#888680;margin-bottom:28px;max-width:320px;font-size:15px}
a.cta{
  display:inline-flex;align-items:center;justify-content:center;
  background:#D4A017;color:#0D0D0D;font-weight:700;font-size:15px;
  padding:14px 32px;border-radius:10px;text-decoration:none;
  min-height:48px;width:100%;max-width:300px;
  transition:background 200ms ease
}
a.cta:hover{background:#E0B030}
a.cta:active{background:#B8880F}
.dots{display:flex;gap:8px;margin-top:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#D4A017;animation:pulse 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
footer{padding:24px 0;text-align:center;font-size:12px;color:#888680;opacity:.5;letter-spacing:.3px}
@media (max-width:374px){.page{padding:0 16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="page">
  <header><img src="/logo-nav.webp" alt="HyPurShot" width="140" height="40"></header>
  <main>
    <h1 id="greet">One moment&hellip;</h1>
    <p id="sub">Taking you to Google Reviews.</p>
    <a id="cta" class="cta" href="#" hidden>Continue to Google Reviews</a>
    <div class="dots" id="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </main>
  <footer>Powered by HyPurShot</footer>
</div>
<script>
(function(){
  "use strict";
  var API = "https://xjsicupdpzawxlwcvxzv.supabase.co/functions/v1/resolve-review-token";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqc2ljdXBkcHphd3hsd2N2eHp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MjgxNjEsImV4cCI6MjA5MDMwNDE2MX0.ZIuEFOCz1T7aVv6a39hXzvUucSZKgTJhDW5iPyXh1KM";

  function getToken(){
    var p = new URLSearchParams(location.search).get("token");
    if(p) return p;
    var parts = location.pathname.split("/").filter(Boolean);
    return parts[parts.length-1] || null;
  }
  function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]});}
  function showError(){
    document.getElementById("greet").textContent = "Link no longer active";
    document.getElementById("sub").textContent = "This review link may have expired. Please reach out to the business directly.";
    document.getElementById("dots").style.display = "none";
  }

  var token = getToken();
  if(!token || token.length < 8){ showError(); return; }

  // Kick off the resolve call immediately \u2014 no waiting for DOMContentLoaded.
  fetch(API + "?token=" + encodeURIComponent(token), {
    method: "GET",
    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY },
    cache: "no-store"
  }).then(function(r){ return r.ok ? r.json() : r.json().then(function(e){throw e;}); })
    .then(function(data){
      if(!data.google_url){
        document.getElementById("greet").textContent = "Almost there";
        document.getElementById("sub").innerHTML = "This business hasn't connected their Google Business Profile yet. Please reach out to " + esc(data.business_name || "the business") + " directly.";
        document.getElementById("dots").style.display = "none";
        return;
      }
      var name = data.customer_name || "there";
      var biz  = data.business_name || "the business";
      document.getElementById("greet").textContent = "Hi " + name + ",";
      document.getElementById("sub").textContent = "Taking you to Google Reviews for " + biz + "\u2026";
      var cta = document.getElementById("cta");
      cta.href = data.google_url;
      cta.hidden = false;
      // Auto-redirect after a short beat so slower devices still get a visual.
      setTimeout(function(){ location.replace(data.google_url); }, 900);
    })
    .catch(function(){ showError(); });
})();
</script>
</body>
</html>
